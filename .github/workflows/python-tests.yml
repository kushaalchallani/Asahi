name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 0'

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: asahi
          POSTGRES_PASSWORD: password
          POSTGRES_DB: asahi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U asahi -d asahi_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        volumes:
          - postgres-data:/var/lib/postgresql/data

    env:
      DATABASE_URL: postgresql+psycopg://asahi:password@localhost:5432/asahi_test
      ASAHI_SECRET_KEY: test-secret-key
      VITE_API_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r dependencies/requirements.txt

      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Run backend tests
        run: cd backend && python -m pytest

      - name: Check frontend build
        run: cd frontend && npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: backend/htmlcov/
          retention-days: 30

jobs:
  lint:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r dependencies/requirements.txt

      - name: Run linting
        run: cd backend && python -m ruff check .

      - name: Check frontend formatting
        run: cd frontend && npm run lint